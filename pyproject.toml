[project]
name = "vsector"
version = "0.1.0"
description = "Vsector - Trillion-Scale Distributed Vector Database System"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vsector Team", email = "team@vsector.io" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf>=5.27.0",
    "aiokafka>=0.11.0",
    "prometheus-client>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "mmh3>=4.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
ann = [
    "hnswlib>=0.8.0",
    "faiss-cpu>=1.8.0",
]

[project.scripts]
vsector = "vsector.cli:main"

[project.urls]
Homepage = "https://github.com/ajit-ai/Vsector"
Repository = "https://github.com/ajit-ai/Vsector"
Issues = "https://github.com/ajit-ai/Vsector/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
