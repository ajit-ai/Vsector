groups:
  - name: vsector.slo
    interval: 30s
    rules:
      # Ingest error budget: >1% errors for 5m
      - alert: VsectorIngestHighErrors
        expr: rate(vsector_ingest_total{status="error"}[5m]) / rate(vsector_ingest_total[5m]) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Ingest error rate >1%" }

      # P99 latency SLO: 50ms@1M, 200ms@any (use histogram_quantile)
      - alert: VsectorP99LatencyHigh
        expr: histogram_quantile(0.99, rate(vsector_query_latency_ms_bucket[5m])) > 200
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "P99 latency >200ms (SLO breach)" }

      # WAL growth
      - alert: VsectorWALHigh
        expr: vsector_wal_bytes > 10737418240  # 10Gi
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "WAL >10Gi, check GC/replication" }

      # Shard degraded (lifecycle)
      - alert: VsectorShardDegraded
        expr: vsector_shard_count < 3
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Shard count below quorum" }

      # QPS drop to zero (outage)
      - alert: VsectorNoTraffic
        expr: rate(vsector_query_total[5m]) == 0
        for: 10m
        labels: { severity: info }
        annotations: { summary: "No query traffic 10m" }
