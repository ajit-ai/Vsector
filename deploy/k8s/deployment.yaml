apiVersion: apps/v1
kind: Deployment
metadata: {name: vsector, labels: {app: vsector}}
spec:
  replicas: 3
  selector: {matchLabels: {app: vsector}}
  template:
    metadata: {labels: {app: vsector}}
    spec:
      containers:
        - name: vsector
          image: vsector:0.1.0
          ports: [{containerPort: 8080, name: http}, {containerPort: 50051, name: grpc}]
          env:
            - {name: VSECTOR_ENV, value: production}
            - {name: VSECTOR_DATA_DIR, value: /data}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, initialDelaySeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: "2", memory: "4Gi"}, limits: {cpu: "4", memory: "8Gi"}}
          # cost-based: shard_count auto-tuned via Namespace.expected_records, HPA scales shards
          env:
            - {name: VSECTOR_SHARD_MAX_VECTORS, value: "50000000000"}
            - {name: VSECTOR_RERANK, value: "mmr"}
      volumes: [{name: data, persistentVolumeClaim: {claimName: vsector-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: vsector}
spec:
  selector: {app: vsector}
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: grpc, port: 50051, targetPort: 50051}
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: vsector-pvc}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 100Gi}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: vsector-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: vsector}
  minReplicas: 3
  maxReplicas: 20
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
