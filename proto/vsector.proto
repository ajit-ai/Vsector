syntax = "proto3";
package vsector;

service VectorDBService {
  rpc Upsert(stream UpsertRequest) returns (UpsertResponse); // client streaming
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc BatchQuery(stream QueryRequest) returns (stream QueryResponse); // bidirectional
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc WatchNamespace(WatchRequest) returns (stream NamespaceEvent); // server streaming
}

message Vector {
  string id = 1;
  string namespace = 2;
  repeated float values = 3;
  map<string, string> metadata = 4;
  int64 created_at = 5;
}

message UpsertRequest {
  string namespace = 1;
  repeated Vector vectors = 2;
  string idempotency_key = 3;
}
message UpsertResponse {
  int32 upserted = 1;
  repeated string ids = 2;
}

message QueryRequest {
  string namespace = 1;
  repeated float vector = 2;
  int32 top_k = 3;
  int32 ef_search = 4;
  map<string, string> filters = 5;
  bool include_metadata = 6;
}

message QueryResponse {
  repeated QueryResult results = 1;
  int64 took_ms = 2;
  int32 shard_count = 3;
}

message QueryResult {
  string id = 1;
  float score = 2;
  map<string, string> metadata = 3;
}

message DeleteRequest { string namespace = 1; repeated string ids = 2; }
message DeleteResponse { int32 deleted = 1; }

message FetchRequest { string namespace = 1; repeated string ids = 2; }
message FetchResponse { repeated Vector vectors = 1; }

message WatchRequest { string namespace = 1; }
message NamespaceEvent { string type = 1; string namespace = 2; string payload = 3; }
